
[providers]
python = "3.12"

[phases.setup]
nixPkgs = ["python312", "python312Packages.pip"]

[phases.install]
cmds = ["python -m ensurepip --upgrade || true", "python -m pip install --upgrade pip", "python -m pip install -r requirements.txt"]

[start]
cmd = "python manage.py migrate && daphne -b 0.0.0.0 -p $PORT config.asgi:application"
